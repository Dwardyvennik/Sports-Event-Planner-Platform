name: sports-event-planner

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args:
        SERVICE: auth-service
    environment:
      APP_ENV: docker
      LOG_LEVEL: info
      GRPC_ADDR: :50051
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://auth_user:auth_pass@auth-postgres:5432/auth_db?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"
      - "8081:8081"
    networks:
      - sports-platform

  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
      args:
        SERVICE: event-service
    environment:
      APP_ENV: docker
      LOG_LEVEL: info
      GRPC_ADDR: :50052
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://event_user:event_pass@event-postgres:5432/event_db?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      event-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "50052:50052"
      - "8082:8082"
    networks:
      - sports-platform

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      APP_ENV: docker
      LOG_LEVEL: info
      GRPC_ADDR: :50053
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://notification_user:notification_pass@notification-postgres:5432/notification_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      notification-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "50053:50053"
      - "8083:8083"
    networks:
      - sports-platform

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      APP_ENV: docker
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      AUTH_SERVICE_GRPC_ADDR: auth-service:50051
      EVENT_SERVICE_GRPC_ADDR: event-service:50052
      NOTIFICATION_SERVICE_GRPC_ADDR: notification-service:50053
    depends_on:
      - auth-service
      - event-service
      - notification-service
    ports:
      - "8080:8080"
    networks:
      - sports-platform

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sports-platform

  event-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
    ports:
      - "5434:5432"
    volumes:
      - event-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sports-platform

  notification-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5435:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sports-platform

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sports-platform

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sports-platform

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - event-service
      - notification-service
      - api-gateway
    networks:
      - sports-platform

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - sports-platform

networks:
  sports-platform:
    name: sports-platform

volumes:
  auth-postgres-data:
  event-postgres-data:
  notification-postgres-data:
  grafana-data:
