groups:
  - name: backend_availability
    interval: 15s
    rules:
      - alert: BackendServiceDown
        expr: up{job=~"api-gateway|auth-service|event-service|notification-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Backend service is down: {{ $labels.job }}"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager"} == 0
        for: 2m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Monitoring target is down: {{ $labels.job }}"
          description: "{{ $labels.job }} is not being scraped by Prometheus."

  - name: backend_errors
    interval: 30s
    rules:
      - alert: HighHTTP5xxRate
        expr: |
          sum by (job) (rate(sports_planner_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job) (rate(sports_planner_http_requests_total[5m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
          category: reliability
        annotations:
          summary: "High HTTP 5xx rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has more than 5% HTTP 5xx responses over 5 minutes."

      - alert: CriticalHTTP5xxRate
        expr: |
          sum by (job) (rate(sports_planner_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (job) (rate(sports_planner_http_requests_total[5m])), 0.001)
          > 0.15
        for: 1m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "Critical HTTP 5xx rate on {{ $labels.job }}"
          description: "{{ $labels.job }} has more than 15% HTTP 5xx responses over 5 minutes."

      - alert: HighGRPCErrorRate
        expr: |
          sum by (service) (rate(sports_planner_grpc_server_errors_total[5m]))
          /
          clamp_min(sum by (service) (rate(sports_planner_grpc_server_requests_total[5m])), 0.001)
          > 0.05
        for: 2m
        labels:
          severity: warning
          category: reliability
        annotations:
          summary: "High gRPC error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has more than 5% failed gRPC requests over 5 minutes."

  - name: backend_latency
    interval: 30s
    rules:
      - alert: HighHTTPLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(sports_planner_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 3m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High HTTP p95 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} HTTP p95 latency is above 1 second."

      - alert: HighGRPCLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (rate(sports_planner_grpc_server_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 3m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High gRPC p95 latency on {{ $labels.service }}"
          description: "{{ $labels.service }} gRPC p95 latency is above 1 second."

  - name: backend_saturation
    interval: 30s
    rules:
      - alert: HighProcessCPU
        expr: rate(process_cpu_seconds_total{job=~"api-gateway|auth-service|event-service|notification-service"}[2m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "High process CPU on {{ $labels.job }}"
          description: "{{ $labels.job }} process CPU usage is above 80%."

      - alert: HighProcessMemory
        expr: process_resident_memory_bytes{job=~"api-gateway|auth-service|event-service|notification-service"} > 536870912
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "High process memory on {{ $labels.job }}"
          description: "{{ $labels.job }} resident memory is above 512MB."

      - alert: HighGoroutines
        expr: go_goroutines{job=~"api-gateway|auth-service|event-service|notification-service"} > 500
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "High goroutine count on {{ $labels.job }}"
          description: "{{ $labels.job }} has more than 500 goroutines."

  - name: nats_flow
    interval: 30s
    rules:
      - alert: NATSConsumerFailures
        expr: increase(sports_planner_nats_consumer_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "NATS consumer failures on {{ $labels.subject }}"
          description: "At least one NATS message failed processing after retries in the last 5 minutes."

      - alert: NATSPublishFailures
        expr: increase(sports_planner_nats_publish_failed_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          category: messaging
        annotations:
          summary: "NATS publish failures on {{ $labels.subject }}"
          description: "At least one NATS publish attempt failed in the last 5 minutes."
