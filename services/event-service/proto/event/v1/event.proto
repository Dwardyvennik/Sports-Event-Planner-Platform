syntax = "proto3";

package sports.event.v1;

option go_package = "github.com/university/sports-event-planner-platform/services/event-service/proto/event/v1;eventv1";

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (EventResponse);
  rpc GetEvent(GetEventRequest) returns (EventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
}

message Event {
  string id = 1;
  string sport = 2;
  string category = 3;
  string competition = 4;
  string title = 5;
  string description = 6;
  string start_time = 7;
  string end_time = 8;
  string status = 9;
  string country = 10;
  string city = 11;
  string created_at = 12;
  string updated_at = 13;
}

message CreateEventRequest {
  string sport = 1;
  string category = 2;
  string competition = 3;
  string title = 4;
  string description = 5;
  string start_time = 6;
  string end_time = 7;
  string status = 8;
  string country = 9;
  string city = 10;
}

message GetEventRequest {
  string event_id = 1;
}

message ListEventsRequest {
  string sport = 1;
  string competition = 2;
  string start_time_from = 3;
  string start_time_to = 4;
  string country = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message EventResponse {
  Event event = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message DeleteEventRequest {
  string event_id = 1;
}

message DeleteEventResponse {
  string event_id = 1;
  bool deleted = 2;
}
