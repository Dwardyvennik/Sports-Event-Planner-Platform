syntax = "proto3";

package sports.event.v1;

option go_package = "github.com/university/sports-event-planner-platform/services/event-service/proto/event/v1;eventv1";

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (EventResponse);
  rpc GetEvent(GetEventRequest) returns (EventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
}

message Event {
  string id = 1;
  string sport = 2;
  string category = 3;
  string competition = 4;
  string title = 5;
  string description = 6;
  string start_time = 7;
  string end_time = 8;
  string status = 9;
  string country = 10;
  string city = 11;
  string venue = 12;
  repeated string participants = 13;
  repeated string tags = 14;
  string created_at = 15;
  string updated_at = 16;
}

message CreateEventRequest {
  string sport = 1;
  string category = 2;
  string competition = 3;
  string title = 4;
  string description = 5;
  string start_time = 6;
  string end_time = 7;
  string status = 8;
  string country = 9;
  string city = 10;
  string venue = 11;
  repeated string participants = 12;
  repeated string tags = 13;
}

message GetEventRequest {
  string event_id = 1;
}

message ListEventsRequest {
  string sport = 1;
  string category = 2;
  string competition = 3;
  string status = 4;
  string country = 5;
  string city = 6;
  string tag = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message EventResponse {
  Event event = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message DeleteEventRequest {
  string event_id = 1;
}

message DeleteEventResponse {
  string event_id = 1;
  bool deleted = 2;
}
