name: sports-event-planner-test

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args:
        SERVICE: auth-service
    environment:
      APP_ENV: test
      LOG_LEVEL: info
      GRPC_ADDR: :50051
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://auth_user:auth_pass@auth-postgres:5432/auth_db?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: integration-test-secret
      JWT_ACCESS_TTL: 5m
      JWT_REFRESH_TTL: 1h
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "15051:50051"

  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
      args:
        SERVICE: event-service
    environment:
      APP_ENV: test
      LOG_LEVEL: info
      GRPC_ADDR: :50052
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://event_user:event_pass@event-postgres:5432/event_db?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
    depends_on:
      event-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "15052:50052"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      APP_ENV: test
      LOG_LEVEL: info
      GRPC_ADDR: :50053
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://notification_user:notification_pass@notification-postgres:5432/notification_db?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "15053:50053"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      APP_ENV: test
      LOG_LEVEL: info
      HTTP_ADDR: :8080
      AUTH_SERVICE_GRPC_ADDR: auth-service:50051
      EVENT_SERVICE_GRPC_ADDR: event-service:50052
      NOTIFICATION_SERVICE_GRPC_ADDR: notification-service:50053
    depends_on:
      - auth-service
      - event-service
      - notification-service
    ports:
      - "18080:8080"

  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 2s
      timeout: 3s
      retries: 20

  auth-migrate:
    image: migrate/migrate:v4.17.1
    command:
      - -path=/migrations
      - -database=postgres://auth_user:auth_pass@auth-postgres:5432/auth_db?sslmode=disable
      - up
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    depends_on:
      auth-postgres:
        condition: service_healthy

  event-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_db"]
      interval: 2s
      timeout: 3s
      retries: 20

  event-migrate:
    image: migrate/migrate:v4.17.1
    command:
      - -path=/migrations
      - -database=postgres://event_user:event_pass@event-postgres:5432/event_db?sslmode=disable
      - up
    volumes:
      - ./services/event-service/migrations:/migrations:ro
    depends_on:
      event-postgres:
        condition: service_healthy

  notification-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 2s
      timeout: 3s
      retries: 20

  notification-migrate:
    image: migrate/migrate:v4.17.1
    command:
      - -path=/migrations
      - -database=postgres://notification_user:notification_pass@notification-postgres:5432/notification_db?sslmode=disable
      - up
    volumes:
      - ./services/notification-service/migrations:/migrations:ro
    depends_on:
      notification-postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
